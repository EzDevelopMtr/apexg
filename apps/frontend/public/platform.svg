<!-- The platform panel's own mark: a 2×2 grid, the panel's icon. Not a gym's
     logo — the panel manages every gym and belongs to none. A favicon cannot
     read CSS tokens, so the hex values are copied from packages/ui/src/theme.css:
     shell #0a0c0e, brand-soft #17354d, brand-ink #75acd7. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0c0e"/>
  <rect x="10" y="10" width="44" height="44" rx="12" fill="#17354d"/>
  <g fill="none" stroke="#75acd7" stroke-width="3.5" stroke-linejoin="round">
    <rect x="19" y="19" width="11" height="11" rx="2.5"/>
    <rect x="34" y="19" width="11" height="11" rx="2.5"/>
    <rect x="19" y="34" width="11" height="11" rx="2.5"/>
    <rect x="34" y="34" width="11" height="11" rx="2.5"/>
  </g>
</svg>
