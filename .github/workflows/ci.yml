name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma de `packageManager` en package.json. Con las dos
      # la acción aborta ("Multiple versions of pnpm specified") antes de
      # correr nada, que es como este CI falló sin ejecutar una sola prueba.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sin paso de formato por ahora: el repo no está limpio según su propio
      # prettier (347 archivos), y formatearlo entero deja siete archivos por
      # encima del tope de 200 líneas de oxlint. Vuelve cuando el repo quede
      # formateado en un cambio propio.

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
